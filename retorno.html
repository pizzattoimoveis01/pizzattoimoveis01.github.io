<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorização · Pizzatto Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css"></head><body>
<header><img src="logo.png" alt="Pizzatto Imóveis"></header>
<main>
<h1 id="t">Autorização recebida</h1>
<div class="caixa" id="ok">
<p><strong>Copie o endereço desta página</strong> (clique na barra de endereço, Ctrl+A e Ctrl+C), volte para a janela preta do <code>DEFINIR_CHAVES_TIKTOK.bat</code> e aperte Enter.</p>
<p>Esta página não guarda nem envia nada: o código fica só no endereço, para o robô usar no seu computador.</p>
</div>
</main>
<script>
var q = new URLSearchParams(location.search);
if (q.get('error')) { document.getElementById('t').textContent = 'A autorização não foi concluída';
  document.getElementById('ok').innerHTML = '<p>O TikTok respondeu: <code>' + (q.get('error_description') || q.get('error')).replace(/[<>&]/g, '') + '</code></p><p>Rode o DEFINIR_CHAVES_TIKTOK.bat de novo.</p>'; }
else if (!q.get('code')) { document.getElementById('t').textContent = 'Página de retorno do login do TikTok';
  document.getElementById('ok').innerHTML = '<p>Esta página só é usada durante a conexão do robô da Pizzatto com o TikTok.</p>'; }
</script>
</body></html>
